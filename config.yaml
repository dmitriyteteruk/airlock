# ---------------------------------------------------------------------------
# Счётчик бульков гидрозатвора. Raspberry Pi 3 + USB-веб-камера.
#
# Всё, что вы меняете через веб-интерфейс, сохраняется в data/overrides.json
# и имеет приоритет над этим файлом. Комментарии здесь при этом не теряются.
# ---------------------------------------------------------------------------

camera:
  device: 0                # индекс или строка вида /dev/video0
  width: 640               # 640x480 — оптимум для Pi 3. 1280x720 уже тяжело.
  height: 480
  fps: 30
  fourcc: MJPG             # MJPG даёт больше кадров/с по USB 2.0, чем YUYV
  buffer_size: 1           # минимальная задержка: всегда берём свежий кадр
  backend: auto            # auto | v4l2 | any
  warmup_frames: 20        # сколько кадров выкинуть при открытии (настройка экспозиции)
  reconnect_delay_s: 2
  # --- Подстроено под камеру из `v4l2-ctl --list-ctrls` (UVC) ---
  # Порядок важен: сначала переключаем автоматику в ручной режим, потом задаём значения,
  # иначе драйвер перезапишет ручные установки.
  #
  # Важно про экспозицию: у этой камеры exposure_time_absolute = 1..10000 (~100 мкс на шаг),
  # и в самом низу один шаг меняет свет вдвое — отсюда «2 темно / 3 пересвет», а промежуточного
  # значения нет. Поэтому держим exposure=2 (без выбитых бликов) и уровень плавно выставляем
  # через brightness (30..255) — это и есть тонкий регулятор. Если при 2 шумно/темно, а при 3
  # выбеливает — это широкий динамический диапазон (яркое окно в кадре): подсветите сам
  # гидрозатвор отдельным светом, тогда хватит низких значений и шума будет меньше.
  controls:
    auto_exposure: 1       # 1 = Manual Mode (меню 0..3). Иначе экспозиция «дышит» = ложные движения
    autofocus: 0           # 0 = выключить автофокус (focus_automatic_continuous); перефокус = ложные движения
    exposure: 2            # грубая выдержка (1..10000); 2 = без клиппинга бликов
    brightness: 150        # 30..255 — плавная регулировка уровня. Поднимите, если темно
    contrast: 5            # 0..10
    saturation: 100        # 0..200
    sharpness: 20          # 0..50
    auto_white_balance: 0  # выключить авто-ББ (white_balance_automatic)
    white_balance: 4250    # 2500..10000 К, раз авто-ББ выключен
    backlight_compensation: 0  # 0..10; если в кадре яркое окно/небо — попробуйте 3..5
    focus: 5               # ручная резкость. Диапазон ЭТОЙ камеры 0..16 (не 0..255!).
                           # Подберите, чтобы гидрозатвор был резким: v4l2-ctl -d /dev/video0 -c focus_absolute=5

vision:
  background: mog2         # mog2 — устойчив к дрейфу освещения; mean — легче для CPU
  mog2_history: 400        # кадров в истории фона
  mog2_threshold: 30       # меньше = чувствительнее (и шумнее)
  mog2_learning_rate: 0.004  # скорость адаптации фона; -1 = автоматически
  mean_alpha: 0.02         # для background: mean
  mean_threshold: 18       # для background: mean
  despeckle: 3             # медианный фильтр маски, 0 = выключен
  process_scale: 1.0       # 0.5 — вдвое меньше пикселей в анализе, экономит CPU
  warmup_frames: 60        # кадров прогрева модели фона перед началом подсчёта
  equalize: false          # выравнивание гистограммы (помогает при плохой подсветке)

detector:
  # Пороги — это ДОЛЯ пикселей зоны (ROI), поэтому держите рамку плотной к гидрозатвору.
  # Ориентир: пузырёк занимает 0.5–3 % площади правильно выбранной зоны.
  on_threshold: 0.004      # выше — движение началось
  off_threshold: 0.0012    # ниже — движение закончилось (бульк засчитан)
  drop_ratio: 0.45         # спад до 45 % от пика тоже завершает бульк
  min_off_frames: 2        # кадров ниже порога для подтверждения
  min_peak_frames: 1       # минимум кадров выше on_threshold (2 — если лезет шум)
  refractory_s: 0.12       # пауза между бульками; 0.12 с = до 500 бульков/мин
  max_hump_s: 4.0          # принудительно закрыть слишком долгое событие
  saturate_ratio: 0.5      # движение больше половины зоны — это помеха, не бульк
  saturate_cooldown_s: 1.0 # остыть после помехи

pipeline:
  process_fps: 20          # частота анализа. 20 к/с хватает: бульк длится 0.1–0.3 с
  log_events: true         # писать каждый бульк в журнал systemd

rois: []
# Зоны задаются из веб-интерфейса (вкладка «Настройка зон») и уезжают в data/overrides.json.
# Вручную формат такой. У каждой зоны можно задать свои пороги в блоке detector —
# они перекрывают глобальный [detector] только для этой зоны (разное освещение/крупность).
# rois:
#   - name: airlock-1
#     x: 250
#     y: 120
#     w: 120
#     h: 180
#   - name: airlock-2
#     x: 420
#     y: 130
#     w: 110
#     h: 170
#     detector:
#       on_threshold: 0.006     # у этой зоны пузырьки мельче — порог выше
#       refractory_s: 0.2

web:
  enabled: true
  host: 0.0.0.0
  port: 8080
  public_port: 0             # отдельный порт только для публичного просмотра (напр. 8081).
                             # 0 = не запускать; публичная страница и так доступна на /public
  token: ""                # задайте непустую строку, если сеть не доверенная
  stream_fps: 5            # частота MJPEG-потока; выше — больше нагрузка на Pi 3
  stream_quality: 72
  stream_scale: 0.8        # 0.8 = отдавать кадр уменьшенным, экономит CPU и трафик
  show_labels: true

storage:
  data_dir: data
  events_file: events.jsonl
  state_file: state.json
  overrides_file: overrides.json
  recent_events: 500       # сколько последних событий держать в памяти для веб-интерфейса
  timeline_minutes: 86400  # глубина гистограммы «по минутам» (60 дней). Длинное окно
                           # автоматически прореживается до удобного шага (мин/час/сутки).
  signal_buffer: 900       # отсчётов сырого сигнала для графика
  signal_sample_hz: 8
  flush_interval_s: 5      # реже пишем на SD-карту — дольше живёт
  snapshots: false         # сохранять кадр с каждым бульком (ест место на SD)
  snapshots_dir: snapshots
  snapshots_keep: 500

alerts:
  stall_minutes: 0         # тревога «брожение встало», если нет бульков N минут. 0 = выключено
